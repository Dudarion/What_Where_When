<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Always light: opt out of forced dark modes (Chrome, Samsung Internet, Dark Reader, ...) -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#e4e4e4">
  <title>What? Where? When?</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>
<body>
  <div id="top">
    <div id="wheel">
      <canvas id="spinner"></canvas>
      <!-- The pointer is a separate layer: it rotates on the GPU while the wheel stays still -->
      <div id="arrow" aria-hidden="true">
        <svg viewBox="-100 -100 200 200">
          <polygon points="-3,0 -3,-65 0,-70 3,-65 3,0" fill="red"/>
          <circle r="7" fill="green"/>
          <circle r="3.5" fill="red"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div class="row">
      <div class="scoreboard">
        <div class="score">
          <span class="score-value">0</span>
          <button type="button" class="score-btn" data-step="1" aria-label="Left score: add a point"><span class="score-arrow"></span></button>
          <button type="button" class="score-btn" data-step="-1" aria-label="Left score: remove a point"><span class="score-arrow"></span></button>
        </div>
        <div class="score">
          <span class="score-value">0</span>
          <button type="button" class="score-btn" data-step="1" aria-label="Right score: add a point"><span class="score-arrow"></span></button>
          <button type="button" class="score-btn" data-step="-1" aria-label="Right score: remove a point"><span class="score-arrow"></span></button>
        </div>
      </div>
      <button type="button" class="btn" id="countdownBtn" data-action="countdown"><span>60</span></button>
      <button type="button" class="btn" data-sound="tenSec"><img src="images/10_sec.png" alt="10 seconds"></button>
      <button type="button" class="btn" data-sound="timeOut"><img src="images/timer.png" alt="Timer"></button>
    </div>
    <div class="row">
      <button type="button" class="btn" data-sound="gong"><img src="images/gong.png" alt="Gong"></button>
      <button type="button" class="btn" data-sound="blackbox"><img src="images/blackbox.png" alt="Black Box"></button>
      <button type="button" class="btn" data-sound="correct"><img src="images/correct.png" alt="Correct Answer"></button>
      <button type="button" class="btn" data-sound="wrong"><img src="images/wrong.png" alt="Wrong Answer"></button>
    </div>
    <div class="row">
      <button type="button" class="btn" data-sound="fanfare"><img src="images/fanfare.png" alt="Fanfare"></button>
      <button type="button" class="btn" data-sound="pause"><img src="images/pause.png" alt="Pause"></button>
      <button type="button" class="btn" data-sound="finish"><img src="images/finish.png" alt="Finish"></button>
      <button type="button" class="btn" data-action="mute"><img src="images/mute.png" alt="Mute"></button>
    </div>
  </div>

  <!-- Main JavaScript (sounds are loaded from here) -->
  <script src="js/app.js"></script>

</body>
</html>
